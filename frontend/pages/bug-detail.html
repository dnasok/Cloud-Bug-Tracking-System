<!DOCTYPE html>
<!--
	File: frontend/pages/bug-detail.html
	Purpose: Shows one bug's details and supports update/delete for privileged users.
-->
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Bug Tracker | Bug Detail</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-slate-100 min-h-screen">
	<main class="max-w-4xl mx-auto p-4 md:p-8">
		<section class="bg-white rounded-xl shadow p-6">
			<h1 class="text-2xl font-bold text-slate-900">Bug Detail</h1>
			<div id="bugDetail" class="mt-6 text-slate-700">Loading...</div>
			<div id="bugActions" class="mt-6"></div>
		</section>
	</main>

	<script src="../js/utils.js"></script>
	<script src="../js/api-client.js"></script>
	<script src="../js/auth.js"></script>
	<script>
		requireAuth();
		mountNavbar({ basePath: "" });

		/** Reads the bug id from URL query parameters. */
		function getBugIdFromQuery() {
			const params = new URLSearchParams(window.location.search);
			return params.get("id");
		}

		/** Renders bug details and privileged update/delete actions. */
		function renderBug(bug) {
			const detail = document.getElementById("bugDetail");
			const actions = document.getElementById("bugActions");
			if (!bug) {
				detail.innerHTML = "<p class='text-red-600'>Bug not found.</p>";
				actions.innerHTML = "";
				return;
			}

			const screenshotBlock = bug.screenshot_url
				? ("<div><p><strong>Screenshot:</strong></p><a class='text-blue-700 hover:underline' target='_blank' rel='noopener noreferrer' href='" + escapeHtml(bug.screenshot_url) + "'>Open original image</a><div class='mt-2'><img class='max-h-96 rounded border border-slate-200' src='" + escapeHtml(bug.screenshot_url) + "' alt='Bug screenshot preview' loading='lazy'/></div></div>")
				: "<p><strong>Screenshot:</strong> -</p>";

			detail.innerHTML =
				"<div class='space-y-3'>" +
					"<p><strong>ID:</strong> #" + escapeHtml(String(bug.id)) + "</p>" +
					"<p><strong>Title:</strong> " + escapeHtml(bug.title || "-") + "</p>" +
					"<p><strong>Description:</strong> " + escapeHtml(bug.description || "-") + "</p>" +
					"<p><strong>Category:</strong> " + escapeHtml(bug.category || "-") + "</p>" +
					"<p><strong>Priority:</strong> " + escapeHtml(bug.priority || "-") + "</p>" +
					"<p><strong>Severity:</strong> " + escapeHtml(bug.severity || "-") + "</p>" +
					"<p><strong>Status:</strong> " + escapeHtml(bug.status || "Open") + "</p>" +
					"<p><strong>Assigned To:</strong> " + escapeHtml(bug.assigned_to || "-") + "</p>" +
					screenshotBlock +
					"<p><strong>Created:</strong> " + escapeHtml(formatDate(bug.created_at)) + "</p>" +
				"</div>";

			if (!isAdminOrDeveloper()) {
				actions.innerHTML = "";
				return;
			}

			actions.innerHTML =
				"<div class='rounded-lg border border-slate-200 p-4 bg-slate-50 space-y-3'>" +
					"<h2 class='font-semibold text-slate-900'>Update Bug</h2>" +
					"<div class='grid grid-cols-1 md:grid-cols-2 gap-3'>" +
						"<div><label class='block text-sm text-slate-700'>Status</label><select id='statusInput' class='mt-1 w-full rounded border border-slate-300 px-3 py-2'><option>Open</option><option>In Progress</option><option>Resolved</option><option>Closed</option></select></div>" +
						"<div><label class='block text-sm text-slate-700'>Assigned To</label><input id='assignedToInput' class='mt-1 w-full rounded border border-slate-300 px-3 py-2' placeholder='developer username'/></div>" +
					"</div>" +
					"<div class='flex gap-2'>" +
						"<button id='updateBugBtn' class='rounded bg-blue-600 text-white px-4 py-2 font-semibold hover:bg-blue-700'>Save Changes</button>" +
						"<button id='deleteBugBtn' class='rounded bg-red-600 text-white px-4 py-2 font-semibold hover:bg-red-700'>Delete Bug</button>" +
					"</div>" +
					"<p id='actionMessage' class='text-sm'></p>" +
				"</div>";

			document.getElementById("statusInput").value = bug.status || "Open";
			document.getElementById("assignedToInput").value = bug.assigned_to || "";

			// Saves modified status/assignee fields for the current bug.
			document.getElementById("updateBugBtn").addEventListener("click", async function () {
				const status = document.getElementById("statusInput").value;
				const assignedTo = document.getElementById("assignedToInput").value.trim();
				const messageEl = document.getElementById("actionMessage");
				messageEl.className = "text-sm text-slate-600";
				messageEl.textContent = "Saving...";

				try {
					const result = await updateBug(bug.id, { status: status, assigned_to: assignedTo });
					if (!result.success) {
						messageEl.className = "text-sm text-red-600";
						messageEl.textContent = result.message || "Failed to update bug.";
						return;
					}

					messageEl.className = "text-sm text-green-700";
					messageEl.textContent = result.message || "Updated.";
					await loadBugDetail();
				} catch (error) {
					messageEl.className = "text-sm text-red-600";
					messageEl.textContent = "Failed to update bug.";
					console.error(error);
				}
			});

			// Deletes the current bug after user confirmation.
			document.getElementById("deleteBugBtn").addEventListener("click", async function () {
				if (!confirm("Delete this bug? This cannot be undone.")) {
					return;
				}

				const messageEl = document.getElementById("actionMessage");
				messageEl.className = "text-sm text-slate-600";
				messageEl.textContent = "Deleting...";

				try {
					const result = await deleteBug(bug.id);
					if (!result.success) {
						messageEl.className = "text-sm text-red-600";
						messageEl.textContent = result.message || "Failed to delete bug.";
						return;
					}

					window.location.href = "dashboard.html";
				} catch (error) {
					messageEl.className = "text-sm text-red-600";
					messageEl.textContent = "Failed to delete bug.";
					console.error(error);
				}
			});
		}

		/** Loads the selected bug and forwards data to the renderer. */
		async function loadBugDetail() {
			const id = getBugIdFromQuery();
			if (!id) {
				document.getElementById("bugDetail").innerHTML = "<p class='text-red-600'>Missing bug id.</p>";
				return;
			}

			try {
				const result = await getBugById(id);
				renderBug(result.bug);
			} catch (error) {
				document.getElementById("bugDetail").innerHTML = "<p class='text-red-600'>Failed to load bug detail.</p>";
				console.error(error);
			}
		}

		loadBugDetail();
	</script>
</body>
</html>
