<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Bug Tracker | Sign Up</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
	<main class="w-full max-w-lg bg-white shadow-xl rounded-2xl p-8">
		<h1 class="text-3xl font-bold text-slate-900">Create Account</h1>
		<p class="text-slate-600 mt-2">Start reporting and managing bugs.</p>

		<form id="signupForm" class="mt-8 space-y-4">
			<div>
				<label for="fullname" class="block text-sm font-medium text-slate-700">Full Name</label>
				<input id="fullname" name="fullname" type="text" required class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
			</div>

			<div>
				<label for="email" class="block text-sm font-medium text-slate-700">Email</label>
				<input id="email" name="email" type="email" required class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
			</div>

			<div>
				<label for="username" class="block text-sm font-medium text-slate-700">Username</label>
				<input id="username" name="username" type="text" required class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
			</div>

			<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
				<div>
					<label for="password" class="block text-sm font-medium text-slate-700">Password</label>
					<input id="password" name="password" type="password" minlength="6" required class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
				</div>

				<div>
					<label for="confirmPassword" class="block text-sm font-medium text-slate-700">Confirm Password</label>
					<input id="confirmPassword" name="confirmPassword" type="password" minlength="6" required class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
				</div>
			</div>

			<div>
				<label for="role" class="block text-sm font-medium text-slate-700">Role</label>
				<select id="role" name="role" required class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
					<option value="user">User</option>
					<option value="developer">Developer</option>
					<option value="admin">Admin</option>
				</select>
			</div>

			<button type="submit" class="w-full rounded-lg bg-blue-600 px-4 py-2 text-white font-semibold hover:bg-blue-700">Create Account</button>
		</form>

		<div id="message" class="mt-4 text-sm"></div>

		<p class="text-sm text-slate-600 mt-6">
			Already have an account?
			<a href="../index.html" class="text-blue-600 font-semibold hover:text-blue-700">Sign in</a>
		</p>
	</main>

	<script src="../js/utils.js"></script>
	<script src="../js/api-client.js"></script>
	<script src="../js/auth.js"></script>
	<script>
		document.getElementById("signupForm").addEventListener("submit", async function (event) {
			event.preventDefault();

			const fullname = document.getElementById("fullname").value.trim();
			const email = document.getElementById("email").value.trim();
			const username = document.getElementById("username").value.trim();
			const password = document.getElementById("password").value;
			const confirmPassword = document.getElementById("confirmPassword").value;
			const role = document.getElementById("role").value;
			const messageEl = document.getElementById("message");

			if (password !== confirmPassword) {
				messageEl.className = "mt-4 text-sm text-red-600";
				messageEl.textContent = "Passwords do not match.";
				return;
			}

			if (!isValidEmail(email)) {
				messageEl.className = "mt-4 text-sm text-red-600";
				messageEl.textContent = "Please enter a valid email.";
				return;
			}

			messageEl.className = "mt-4 text-sm text-slate-600";
			messageEl.textContent = "Creating account...";

			try {
				const result = await signupUser({ fullname, email, username, password, role });
				if (!result.success) {
					messageEl.className = "mt-4 text-sm text-red-600";
					messageEl.textContent = result.message || "Could not create account.";
					return;
				}

				messageEl.className = "mt-4 text-sm text-green-700";
				messageEl.textContent = "Account created. Redirecting to login...";
				setTimeout(function () {
					window.location.href = "../index.html";
				}, 1000);
			} catch (error) {
				messageEl.className = "mt-4 text-sm text-red-600";
				messageEl.textContent = "Unable to create account right now.";
				console.error(error);
			}
		});
	</script>
</body>
</html>
