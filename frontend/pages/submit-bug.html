<!DOCTYPE html>
<!--
	File: frontend/pages/submit-bug.html
	Purpose: Captures new bug reports and submits them via the API client.
-->
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Bug Tracker | Submit Bug</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-slate-100 min-h-screen">
	<main class="max-w-3xl mx-auto p-4 md:p-8">
		<section class="bg-white rounded-xl shadow p-6">
			<h1 class="text-2xl font-bold text-slate-900">Submit Bug</h1>
			<p class="text-slate-600 mt-1">Report a new issue for classification and tracking.</p>

			<form id="submitBugForm" class="mt-6 space-y-4">
				<div>
					<label for="title" class="block text-sm font-medium text-slate-700">Title</label>
					<input id="title" name="title" type="text" required class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2" />
				</div>

				<div>
					<label for="severity" class="block text-sm font-medium text-slate-700">Severity</label>
					<select id="severity" name="severity" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2">
						<option value="Low">Low</option>
						<option value="Medium">Medium</option>
						<option value="High">High</option>
						<option value="Critical">Critical</option>
					</select>
				</div>

				<div>
					<label for="description" class="block text-sm font-medium text-slate-700">Description</label>
					<textarea id="description" name="description" rows="6" required class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2"></textarea>
				</div>

				<div>
					<label for="screenshot" class="block text-sm font-medium text-slate-700">Screenshot (optional)</label>
					<input id="screenshot" name="screenshot" type="file" accept="image/png,image/jpeg,image/webp,image/gif" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2" />
					<p class="mt-1 text-xs text-slate-500">Accepted types: PNG, JPG, WEBP, GIF. Max 5 MB.</p>
					<div id="screenshotPreviewContainer" class="hidden mt-3">
						<p class="text-xs text-slate-600 mb-2">Preview</p>
						<img id="screenshotPreview" alt="Selected screenshot preview" class="max-h-48 rounded border border-slate-200" />
					</div>
				</div>

				<button id="submitButton" type="submit" class="rounded-lg bg-blue-600 px-4 py-2 text-white font-semibold hover:bg-blue-700">Submit</button>
				<div id="uploadProgressContainer" class="hidden mt-2">
					<div class="w-full bg-slate-200 rounded h-2 overflow-hidden">
						<div id="uploadProgressBar" class="h-2 bg-blue-600" style="width: 0%;"></div>
					</div>
					<p id="uploadProgressText" class="mt-1 text-xs text-slate-600">0%</p>
				</div>
			</form>

			<div id="submitMessage" class="mt-4 text-sm"></div>
		</section>
	</main>

	<script src="../js/utils.js"></script>
	<script src="../js/api-client.js"></script>
	<script src="../js/auth.js"></script>
	<script>
		requireAuth();
		mountNavbar({ basePath: "" });
		const screenshotInput = document.getElementById("screenshot");
		const previewContainer = document.getElementById("screenshotPreviewContainer");
		const previewImage = document.getElementById("screenshotPreview");
		const submitButton = document.getElementById("submitButton");
		const progressContainer = document.getElementById("uploadProgressContainer");
		const progressBar = document.getElementById("uploadProgressBar");
		const progressText = document.getElementById("uploadProgressText");

		screenshotInput.addEventListener("change", function () {
			const file = screenshotInput.files[0];
			if (!file) {
				previewContainer.classList.add("hidden");
				previewImage.removeAttribute("src");
				return;
			}

			const reader = new FileReader();
			reader.onload = function (event) {
				previewImage.src = event.target.result;
				previewContainer.classList.remove("hidden");
			};
			reader.readAsDataURL(file);
		});

		function setSubmittingState(isSubmitting) {
			submitButton.disabled = isSubmitting;
			submitButton.classList.toggle("opacity-60", isSubmitting);
			submitButton.classList.toggle("cursor-not-allowed", isSubmitting);
		}

		function setUploadProgress(percent, label) {
			progressContainer.classList.remove("hidden");
			const bounded = Math.max(0, Math.min(100, percent));
			progressBar.style.width = bounded + "%";
			progressText.textContent = label || (bounded + "%");
		}

		function resetUploadProgress() {
			progressBar.style.width = "0%";
			progressText.textContent = "0%";
			progressContainer.classList.add("hidden");
		}

		// Handles bug submission form validation and API submission feedback.
		document.getElementById("submitBugForm").addEventListener("submit", async function (event) {
			event.preventDefault();

			const title = document.getElementById("title").value.trim();
			const description = document.getElementById("description").value.trim();
			const severity = document.getElementById("severity").value;
			const screenshotFile = document.getElementById("screenshot").files[0] || null;
			const messageEl = document.getElementById("submitMessage");

			if (!title || !description) {
				messageEl.className = "mt-4 text-sm text-red-600";
				messageEl.textContent = "Title and description are required.";
				return;
			}

			setSubmittingState(true);
			resetUploadProgress();

			messageEl.className = "mt-4 text-sm text-slate-600";
			messageEl.textContent = "Submitting bug...";

			try {
				let screenshotUrl = "";

				if (screenshotFile) {
					messageEl.textContent = "Uploading screenshot...";
					setUploadProgress(25, "Preparing upload...");
					const uploadResult = await uploadScreenshot(screenshotFile);
					setUploadProgress(80, "Processing uploaded image...");
					if (!uploadResult.success) {
						messageEl.className = "mt-4 text-sm text-red-600";
						messageEl.textContent = uploadResult.message || "Screenshot upload failed.";
						setSubmittingState(false);
						resetUploadProgress();
						return;
					}
					screenshotUrl = uploadResult.url;
					setUploadProgress(100, "Screenshot uploaded.");
				}

				messageEl.textContent = "Creating bug record...";
				const result = await submitBug({
					title: title,
					description: description,
					severity: severity,
					screenshot_url: screenshotUrl
				});
				if (result.success) {
					messageEl.className = "mt-4 text-sm text-green-700";
					messageEl.textContent = result.message || "Bug submitted successfully.";
					document.getElementById("submitBugForm").reset();
					previewContainer.classList.add("hidden");
					previewImage.removeAttribute("src");
					setTimeout(resetUploadProgress, 600);
				} else {
					messageEl.className = "mt-4 text-sm text-red-600";
					messageEl.textContent = result.message || "Request failed.";
				}
			} catch (error) {
				messageEl.className = "mt-4 text-sm text-red-600";
				messageEl.textContent = "Failed to submit bug.";
				console.error(error);
			} finally {
				setSubmittingState(false);
				if (!screenshotFile) {
					resetUploadProgress();
				}
			}
		});
	</script>
</body>
</html>
