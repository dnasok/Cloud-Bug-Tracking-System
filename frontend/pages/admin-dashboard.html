<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Bug Tracker | Admin Dashboard</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-slate-100 min-h-screen">
	<main class="max-w-6xl mx-auto p-4 md:p-8">
		<section class="bg-white rounded-xl shadow p-6">
			<h1 class="text-2xl font-bold text-slate-900">Admin Dashboard</h1>
			<p class="text-slate-600 mt-1">High-level status summary for bug management.</p>

			<div id="summary" class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-6"></div>
		</section>
	</main>

	<script src="../js/utils.js"></script>
	<script src="../js/api-client.js"></script>
	<script src="../js/auth.js"></script>
	<script>
		requireAdminOrDeveloper();
		mountNavbar({ basePath: "" });

		async function loadSummary() {
			try {
				const result = await getBugList();
				const bugs = Array.isArray(result.bugs) ? result.bugs : [];
				const openCount = bugs.filter(function (item) { return (item.status || "Open") === "Open"; }).length;
				const progressCount = bugs.filter(function (item) { return (item.status || "") === "In Progress"; }).length;
				const resolvedCount = bugs.filter(function (item) { return (item.status || "") === "Resolved"; }).length;

				const cards = [
					{ label: "Open", value: openCount, color: "text-red-700" },
					{ label: "In Progress", value: progressCount, color: "text-amber-700" },
					{ label: "Resolved", value: resolvedCount, color: "text-green-700" }
				];

				document.getElementById("summary").innerHTML = cards.map(function (card) {
					return "<article class='rounded-lg border border-slate-200 p-4 bg-slate-50'>" +
						"<h2 class='text-sm text-slate-600'>" + escapeHtml(card.label) + "</h2>" +
						"<p class='text-3xl font-bold " + card.color + " mt-2'>" + escapeHtml(String(card.value)) + "</p>" +
					"</article>";
				}).join("");
			} catch (error) {
				document.getElementById("summary").innerHTML = "<p class='text-red-600'>Failed to load summary.</p>";
				console.error(error);
			}
		}

		loadSummary();
	</script>
</body>
</html>
