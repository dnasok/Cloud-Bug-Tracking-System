<!DOCTYPE html>
<!--
	File: frontend/pages/profile.html
	Purpose: Displays the current user's profile info and simple bug metrics.
-->
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Bug Tracker | Profile</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-slate-100 min-h-screen">
	<main class="max-w-4xl mx-auto p-4 md:p-8">
		<section class="bg-white rounded-xl shadow p-6">
			<h1 class="text-2xl font-bold text-slate-900">My Profile</h1>
			<div id="profileCard" class="mt-6 text-slate-700">Loading profile...</div>
		</section>
	</main>

	<script src="../js/utils.js"></script>
	<script src="../js/api-client.js"></script>
	<script src="../js/auth.js"></script>
	<script>
		requireAuth();
		mountNavbar({ basePath: "" });

		/** Loads authenticated user info and simple bug statistics. */
		async function loadProfile() {
			const user = getAuthState();
			if (!user) {
				document.getElementById("profileCard").innerHTML = "<p class='text-red-600'>No user found.</p>";
				return;
			}

			try {
				const result = await getBugList();
				const bugs = Array.isArray(result.bugs) ? result.bugs : [];
				const total = bugs.length;
				const open = bugs.filter(function (item) { return (item.status || "Open") === "Open"; }).length;

				document.getElementById("profileCard").innerHTML =
					"<div class='space-y-2'>" +
						"<p><strong>Username:</strong> " + escapeHtml(user.username || "-") + "</p>" +
						"<p><strong>Role:</strong> " + escapeHtml(user.role || "-") + "</p>" +
						"<p><strong>Known Bugs in System:</strong> " + escapeHtml(String(total)) + "</p>" +
						"<p><strong>Open Bugs:</strong> " + escapeHtml(String(open)) + "</p>" +
					"</div>";
			} catch (error) {
				document.getElementById("profileCard").innerHTML =
					"<div class='space-y-2'>" +
						"<p><strong>Username:</strong> " + escapeHtml(user.username || "-") + "</p>" +
						"<p><strong>Role:</strong> " + escapeHtml(user.role || "-") + "</p>" +
					"</div>";
				console.error(error);
			}
		}

		loadProfile();
	</script>
</body>
</html>
